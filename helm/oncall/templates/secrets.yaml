{{- if not .Values.oncall.secrets.existingSecret }}
{{- /*
The credentials this chart owns are generated once and then reused: an upgrade looks the secret up
in the cluster and carries the stored values forward. Rotating SECRET_KEY logs every user out;
rotating MIRAGE_SECRET_KEY or MIRAGE_CIPHER_IV makes every mirage-encrypted column decrypt to
garbage, and mirage swallows the error rather than raising, so the corruption is silent. Stability
here is a data-integrity requirement, not a convenience.

`lookup` needs an API server, so under `helm template` and `helm lint` it returns nothing and the
rendered manifest shows freshly generated values. `helm install` / `helm upgrade` keep them stable.
Production installs should still prefer oncall.secrets.existingSecret and manage these out of band.
*/}}
{{- $secretName := include "oncall.fullname" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existingSecret }}
{{- $existingData = ($existingSecret.data | default dict) }}
{{- end }}
{{- $secretKey := "" }}
{{- if .Values.oncall.secrets.secretKey }}
{{- $secretKey = .Values.oncall.secrets.secretKey | b64enc }}
{{- else if get $existingData "SECRET_KEY" }}
{{- $secretKey = get $existingData "SECRET_KEY" }}
{{- else }}
{{- $secretKey = randAlphaNum 50 | b64enc }}
{{- end }}
{{- $mirageSecretKey := "" }}
{{- if .Values.oncall.secrets.mirageSecretKey }}
{{- $mirageSecretKey = .Values.oncall.secrets.mirageSecretKey | b64enc }}
{{- else if get $existingData "MIRAGE_SECRET_KEY" }}
{{- $mirageSecretKey = get $existingData "MIRAGE_SECRET_KEY" }}
{{- else }}
{{- $mirageSecretKey = randAlphaNum 40 | b64enc }}
{{- end }}
{{- $mirageCipherIV := "" }}
{{- if .Values.oncall.mirageCipherIV }}
{{- include "snippet.oncall.mirageCipherIV.validate" .Values.oncall.mirageCipherIV }}
{{- $mirageCipherIV = .Values.oncall.mirageCipherIV | toString | b64enc }}
{{- else if get $existingData "MIRAGE_CIPHER_IV" }}
{{- $mirageCipherIV = get $existingData "MIRAGE_CIPHER_IV" }}
{{- else if $existingSecret }}
{{- /*
The secret exists but predates the IV being stored in it, so this release has been running on the
old hard-coded "1234567890abcdef". Keep it: generating a fresh IV during an upgrade would corrupt
every value already encrypted with the old one.
*/}}
{{- $mirageCipherIV = "1234567890abcdef" | b64enc }}
{{- else }}
{{- $mirageCipherIV = randAlphaNum 16 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
  {{- if .Values.migrate.useHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  {{- end }}
type: Opaque
data:
  {{ include "snippet.oncall.secret.secretKey" . }}: {{ $secretKey | quote }}
  {{ include "snippet.oncall.secret.mirageSecretKey" . }}: {{ $mirageSecretKey | quote }}
  {{ include "snippet.oncall.secret.mirageCipherIV" . }}: {{ $mirageCipherIV | quote }}
---
{{- end }}
{{- if and (eq .Values.database.type "mysql") (not .Values.mariadb.enabled) (not .Values.externalMysql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}-mysql-external
  {{- if .Values.migrate.useHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  {{- end }}
type: Opaque
data:
  mariadb-root-password: {{ required "externalMysql.password is required if not mariadb.enabled and not externalMysql.existingSecret" .Values.externalMysql.password | b64enc | quote }}
---
{{- end }}
{{- if and (not .Values.postgresql.enabled) (eq .Values.database.type "postgresql") (not .Values.externalPostgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}-postgresql-external
  {{- if .Values.migrate.useHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  {{- end }}
type: Opaque
data:
  postgres-password: {{ required "externalPostgresql.password is required if not postgresql.enabled and not externalPostgresql.existingSecret" .Values.externalPostgresql.password | b64enc | quote }}
---
{{- end }}
{{- if and (eq .Values.broker.type "rabbitmq") (.Values.externalRabbitmq.password) (not .Values.rabbitmq.enabled) (not .Values.externalRabbitmq.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}-rabbitmq-external
  {{- if .Values.migrate.useHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  {{- end }}
type: Opaque
data:
  rabbitmq-password: {{ required "externalRabbitmq.password is required if not rabbitmq.enabled and not externalRabbitmq.existingSecret" .Values.externalRabbitmq.password | b64enc | quote }}
---
{{- end }}
{{- if and (.Values.externalRedis.host) (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}-redis-external
  {{- if .Values.migrate.useHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
  {{- end }}
type: Opaque
data:
  redis-password: {{ required "externalRedis.password is required if not redis.enabled and not externalRedis.existingSecret" .Values.externalRedis.password | b64enc | quote }}
---
{{- end }}
{{- if and .Values.oncall.smtp.enabled .Values.oncall.smtp.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}-smtp
type: Opaque
data:
  smtp-password: {{ .Values.oncall.smtp.password | b64enc | quote }}
---
{{- end }}
{{- if and .Values.oncall.exporter.enabled .Values.oncall.exporter.authToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}-exporter
type: Opaque
data:
  exporter-secret: {{ .Values.oncall.exporter.authToken | b64enc | quote }}
---
{{- end }}
