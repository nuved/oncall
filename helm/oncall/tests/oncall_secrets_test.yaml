suite: test chart-owned OnCall secret generation
templates:
  - secrets.yaml
release:
  name: oncall
  namespace: oncall-ns
tests:
  - it: generates all three credentials into the chart-owned secret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: oncall
      - exists:
          path: data.SECRET_KEY
      - exists:
          path: data.MIRAGE_SECRET_KEY
      - exists:
          path: data.MIRAGE_CIPHER_IV
  # randAlphaNum is base64-encoded in the manifest, so the assertions below pin the encoded
  # length: 50 raw bytes -> 68 chars with one pad, 40 -> 56 with two, 16 -> 24 with two.
  - it: generated SECRET_KEY is 50 characters
    asserts:
      - matchRegex:
          path: data.SECRET_KEY
          pattern: ^[A-Za-z0-9+/]{67}=$
  - it: generated MIRAGE_SECRET_KEY is 40 characters
    asserts:
      - matchRegex:
          path: data.MIRAGE_SECRET_KEY
          pattern: ^[A-Za-z0-9+/]{54}==$
  - it: generated MIRAGE_CIPHER_IV is exactly 16 characters, the AES-CBC block size
    asserts:
      - matchRegex:
          path: data.MIRAGE_CIPHER_IV
          pattern: ^[A-Za-z0-9+/]{22}==$
  - it: explicit values are used verbatim instead of generated ones
    set:
      oncall.mirageCipherIV: "0123456789abcdef"
      oncall.secrets:
        secretKey: "my-secret-value"
        mirageSecretKey: "my-mirage-secret-value"
    asserts:
      - equal:
          path: data.SECRET_KEY
          value: bXktc2VjcmV0LXZhbHVl
      - equal:
          path: data.MIRAGE_SECRET_KEY
          value: bXktbWlyYWdlLXNlY3JldC12YWx1ZQ==
      - equal:
          path: data.MIRAGE_CIPHER_IV
          value: MDEyMzQ1Njc4OWFiY2RlZg==
  - it: existingSecret skips the generated secret entirely
    set:
      oncall.secrets:
        existingSecret: my-oncall-secret
        secretKey: SECRET_KEY
        mirageSecretKey: MIRAGE_SECRET_KEY
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects a cipher IV that is not 16 characters
    set:
      oncall.mirageCipherIV: "tooshort"
    asserts:
      - failedTemplate:
          errorMessage: >-
            oncall.mirageCipherIV must be exactly 16 characters long (AES-CBC IV size), got 8
            ("tooshort"). Quote the value in values.yaml if it is all digits.
  - it: accepts an all-digit cipher IV when it is quoted
    set:
      oncall.mirageCipherIV: "1234567890123456"
    asserts:
      - equal:
          path: data.MIRAGE_CIPHER_IV
          value: MTIzNDU2Nzg5MDEyMzQ1Ng==
  # Unquoted, YAML parses this as a number that stringifies to scientific notation. The old
  # template quoted it blindly and shipped a broken 21-character IV; rendering must fail instead.
  - it: rejects an unquoted all-digit cipher IV instead of shipping scientific notation
    set:
      oncall.mirageCipherIV: 1234567890123456
    asserts:
      - failedTemplate:
          errorMessage: >-
            oncall.mirageCipherIV must be exactly 16 characters long (AES-CBC IV size), got 21
            ("1.234567890123456e+15"). Quote the value in values.yaml if it is all digits.
  - it: rejects a short cipher IV
    set:
      oncall.mirageCipherIV: "12345"
    asserts:
      - failedTemplate:
          errorMessage: >-
            oncall.mirageCipherIV must be exactly 16 characters long (AES-CBC IV size), got 5
            ("12345"). Quote the value in values.yaml if it is all digits.
