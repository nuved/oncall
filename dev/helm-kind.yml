# Values for installing the released chart on a small kind cluster (one node, laptop-sized).
#
#   kind create cluster --name oncall --image kindest/node:v1.37.0
#   helm install oncall ./helm/oncall -f dev/helm-kind.yml --wait --timeout 15m
#   kubectl port-forward svc/oncall-grafana 3001:80   # then open http://localhost:3001 (admin / see below)
#   kubectl get secret oncall-grafana -o jsonpath='{.data.admin-password}' | base64 -d
#
# Differences from the chart defaults: no ingress, ingress-nginx or cert-manager (port-forward instead),
# Redis as the Celery broker instead of RabbitMQ, one replica of everything, and Prometheus enabled with a
# scrape job for the OnCall exporter so the Insights dashboard has data.
base_url: oncall-engine:8080
base_url_protocol: http

env:
  - name: GRAFANA_CLOUD_NOTIFICATIONS_ENABLED
    value: "False"

oncall:
  # the chart renders FEATURE_PROMETHEUS_EXPORTER_ENABLED itself; adding it under env: as well makes
  # Helm 4 (server-side apply) reject the Deployment for a duplicate env key
  exporter:
    enabled: true

engine:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
celery:
  replicaCount: 1
  worker_beat_enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi

broker:
  type: redis
rabbitmq:
  enabled: false
redis:
  architecture: standalone
  master:
    disableCommands: []

# PostgreSQL instead of the chart's MariaDB default: the engine's migrations warn that MariaDB
# cannot create a unique constraint on an expression (alerts.AlertReceiveChannel, W044), so that
# integrity rule silently does not exist on MariaDB. PostgreSQL has it.
# Enabling the subchart on an already installed release: Bitnami charts refuse to generate a
# password during an upgrade, so create the secret first, with the ownership metadata Helm needs
# to adopt it (fresh installs generate the secret themselves):
#   kubectl create secret generic <release>-postgresql \
#     --from-literal=postgres-password=$(openssl rand -hex 16) --from-literal=password=$(openssl rand -hex 16)
#   kubectl label secret <release>-postgresql app.kubernetes.io/managed-by=Helm
#   kubectl annotate secret <release>-postgresql meta.helm.sh/release-name=<release> \
#     meta.helm.sh/release-namespace=<namespace>
database:
  type: postgresql
mariadb:
  enabled: false
postgresql:
  enabled: true
  primary:
    persistence:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

ingress:
  enabled: false
ingress-nginx:
  enabled: false
cert-manager:
  enabled: false

grafana:
  replicas: 1
  service:
    type: ClusterIP
  grafana.ini:
    server:
      # reached through `kubectl port-forward svc/<release>-grafana 3001:80`; served at the root,
      # not under /grafana/, so http://localhost:3001 works and redirects stay on localhost
      domain: localhost:3001
      root_url: "%(protocol)s://%(domain)s/"
      serve_from_sub_path: false

prometheus:
  enabled: true
  alertmanager:
    enabled: false
  # cluster-level metrics (pod phases, deployments, node CPU/memory/disk); also scraped by Alloy
  # into Mimir when dev/observability is installed
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  prometheus-pushgateway:
    enabled: false
  server:
    persistentVolume:
      enabled: false
    global:
      scrape_interval: 15s
  extraScrapeConfigs: |
    - job_name: oncall-exporter
      metrics_path: /metrics/
      static_configs:
        - targets:
            - oncall-engine.default.svc.cluster.local:8080
