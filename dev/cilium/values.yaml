# Cilium for the kind cluster: replaces kube-proxy, keeps its state in the dedicated etcd from
# etcd.yaml, exports metrics and dashboards, Hubble on for flow visibility.
# install.sh sets k8sServiceHost and etcd.endpoints from the control-plane node's IP.
kubeProxyReplacement: true
k8sServicePort: 6443

ipam:
  mode: kubernetes

# state in the dedicated etcd (identities included), not in CRDs
etcd:
  enabled: true
  ssl: false
identityAllocationMode: kvstore

operator:
  replicas: 1
  prometheus:
    enabled: true
  dashboards:
    enabled: true
    annotations:
      grafana_folder: Cilium

prometheus:
  enabled: true
dashboards:
  enabled: true
  annotations:
    grafana_folder: Cilium

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium

resources:
  requests:
    cpu: 100m
    memory: 256Mi
