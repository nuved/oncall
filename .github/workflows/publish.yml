name: Publish release

# Pushing a tag such as v1.17.0 builds the engine image for amd64 and arm64,
# publishes it to GHCR, builds the plugin archive, and creates the GitHub
# release with the archive attached. An annotated tag's message becomes the
# release codename, e.g. `git tag -a v1.17.0 -m "Mansour"`.

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oncall

jobs:
  engine-image:
    name: Engine image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set engine version in settings
        uses: ./.github/actions/set-engine-version-in-settings
        with:
          working_directory: .
          engine_version_number: ${{ github.ref_name }}
          settings_file_path: engine/settings/base.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: engine/
          platforms: linux/${{ matrix.arch }}
          target: prod
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=engine-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=engine-${{ matrix.arch }}

  engine-manifest:
    name: Engine multi-arch manifest
    needs: engine-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$GITHUB_REF_NAME-amd64" \
            "$IMAGE:$GITHUB_REF_NAME-arm64"

  plugin:
    name: Plugin archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install frontend dependencies
        uses: ./.github/actions/install-frontend-dependencies
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: grafana-plugin/go.mod
          cache-dependency-path: grafana-plugin/go.sum
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0
      - name: Build and package plugin
        working-directory: grafana-plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version=$v' package.json > package.new && mv package.new package.json
          pnpm build
          mage -v buildAll
          mv dist grafana-oncall-app
          zip -qr "grafana-oncall-app-$version.zip" grafana-oncall-app
          sha256sum "grafana-oncall-app-$version.zip" > "grafana-oncall-app-$version.zip.sha256"
          cat "grafana-oncall-app-$version.zip.sha256"
      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            grafana-plugin/grafana-oncall-app-*.zip
            grafana-plugin/grafana-oncall-app-*.zip.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs:
      - engine-manifest
      - plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download plugin archive
        uses: actions/download-artifact@v4
        with:
          name: plugin
          path: assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # actions/checkout stores the tag peeled, so read the annotation through the API
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')"
          codename=""
          if [ "$tag_type" = "tag" ]; then
            codename="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.message' | head -1)"
          fi
          title="$tag"
          if [ -n "$codename" ]; then title="$tag \"$codename\""; fi
          {
            echo "Engine image: \`$IMAGE:$tag\` (linux/amd64, linux/arm64)."
            echo "Plugin: \`grafana-oncall-app-$version.zip\` attached below, sha256 alongside."
            echo "It is unsigned, so Grafana needs \`GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-oncall-app\`;"
            echo "the docker-compose files and the Helm chart already set it."
            echo
            echo "Run the hobby stack at this version with \`ONCALL_VERSION=$version docker compose up -d\`."
            echo
          } > notes.md
          gh release create "$tag" --title "$title" --notes-file notes.md --generate-notes assets/*
